<circle cx="288" cy="368" r="40" fill="#fff" fill-opacity="0.95"/>
<path d="M196 520 L318 404 L410 482 L486 420 L628 536 L628 552 L196 552 Z" fill="#164a95" fill-opacity="0.62"/>
</g>
