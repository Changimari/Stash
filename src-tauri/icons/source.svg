<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- macOS Big Sur 以降のアイコングリッド: 1024 キャンバスに 824 の角丸正方形を中央配置 -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E4B5E"/>
      <stop offset="0.5" stop-color="#242C39"/>
      <stop offset="1" stop-color="#151A23"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.17"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardTop" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE4EF"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BB0FF"/>
      <stop offset="1" stop-color="#0A72E8"/>
    </linearGradient>
    <filter id="stackShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <clipPath id="clipTop">
      <rect x="172" y="312" width="480" height="316" rx="42"/>
    </clipPath>
  </defs>

  <g transform="translate(100,100)">
    <rect width="824" height="824" rx="185" ry="185" fill="url(#body)"/>
    <rect width="824" height="824" rx="185" ry="185" fill="url(#sheen)"/>
    <rect x="1.5" y="1.5" width="821" height="821" rx="184" ry="184" fill="none"
          stroke="#ffffff" stroke-opacity="0.11" stroke-width="3"/>

    <!-- 積み重なった素材カード。奥から手前へ。装飾はこれ 1 つに絞る（§5） -->
    <g filter="url(#stackShadow)">
      <rect x="256" y="180" width="312" height="200" rx="34" fill="#93A6BE" opacity="0.40"/>
      <rect x="214" y="246" width="396" height="240" rx="38" fill="#C6D2E2" opacity="0.70"/>

      <rect x="172" y="312" width="480" height="316" rx="42" fill="url(#cardTop)"/>
      <g clip-path="url(#clipTop)">
        <circle cx="288" cy="412" r="41" fill="url(#sky)"/>
        <path d="M172 596 L302 452 L406 566 L482 486 L652 664 L652 628 L172 628 Z" fill="#66788F"/>
        <path d="M406 566 L482 486 L652 632 L652 628 L400 628 Z" fill="#8CA0B8"/>
        <path d="M172 628 L652 628 L652 664 L172 664 Z" fill="#66788F"/>
      </g>
      <rect x="173.5" y="313.5" width="477" height="313" rx="40.5" fill="none"
            stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    </g>
  </g>
</svg>
