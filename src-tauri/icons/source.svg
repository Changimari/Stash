<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
<stop offset="0" stop-color="#6473FF"/><stop offset="0.55" stop-color="#3A3ED6"/><stop offset="1" stop-color="#211C78"/>
</linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset="0.42" stop-color="#fff" stop-opacity="0.03"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="photo" x1="0" y1="0" x2="0.5" y2="1">
<stop offset="0" stop-color="#7FCBFF"/><stop offset="1" stop-color="#2E6FD0"/>
</linearGradient>
<filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
<feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0A0730" flood-opacity="0.5"/>
</filter>
<clipPath id="pc"><rect x="196" y="300" width="432" height="252" rx="20"/></clipPath>
</defs>
<g transform="translate(100,100)">
<rect width="824" height="824" rx="185" fill="url(#bg)"/>
<rect width="824" height="824" rx="185" fill="url(#sh)"/>
<rect x="1.5" y="1.5" width="821" height="821" rx="184" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>
<g filter="url(#drop)">
<!-- 奥のカードは 1 枚だけ。小さいサイズで潰れないよう要素を減らす -->
<rect x="226" y="168" width="372" height="180" rx="34" fill="#C9CFF8" opacity="0.62"/>
